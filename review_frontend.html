<title>Civics Review Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F4F6F9;--panel:#FFF;--panel-2:#FAFBFD;--ink:#161A22;--muted:#5B6573;
  --line:#E3E7ED;--line-2:#EDF0F5;--accent:#1F3A5F;--accent-soft:#E8EEF6;--accent-ink:#1F3A5F;
  --ok:#2E7D5B;--ok-soft:#E5F1EB;--no:#B23B3B;--no-soft:#F8E8E8;--warn:#9A6A10;--warn-soft:#F6EBD3;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-doc:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --radius:12px;--shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F131A;--panel:#181D27;--panel-2:#141922;--ink:#E7EBF1;--muted:#98A2B1;
  --line:#29313D;--line-2:#222933;--accent:#7BA7D9;--accent-soft:#1B2636;--accent-ink:#B9D0EC;
  --ok:#58C596;--ok-soft:#17281F;--no:#E38585;--no-soft:#2A1A1A;--warn:#D9A951;--warn-soft:#2A2413;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}}
:root[data-theme="light"]{
  --bg:#F4F6F9;--panel:#FFF;--panel-2:#FAFBFD;--ink:#161A22;--muted:#5B6573;
  --line:#E3E7ED;--line-2:#EDF0F5;--accent:#1F3A5F;--accent-soft:#E8EEF6;--accent-ink:#1F3A5F;
  --ok:#2E7D5B;--ok-soft:#E5F1EB;--no:#B23B3B;--no-soft:#F8E8E8;--warn:#9A6A10;--warn-soft:#F6EBD3;
  --shadow:0 1px 2px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.06);}
:root[data-theme="dark"]{
  --bg:#0F131A;--panel:#181D27;--panel-2:#141922;--ink:#E7EBF1;--muted:#98A2B1;
  --line:#29313D;--line-2:#222933;--accent:#7BA7D9;--accent-soft:#1B2636;--accent-ink:#B9D0EC;
  --ok:#58C596;--ok-soft:#17281F;--no:#E38585;--no-soft:#2A1A1A;--warn:#D9A951;--warn-soft:#2A2413;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.meter{flex:1;min-width:180px;display:flex;flex-direction:column;gap:5px}
.meter .track{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden;display:flex}
.meter .track i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meter .lbl{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;font-family:var(--font-mono)}
.counts{display:flex;gap:6px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.pend{background:var(--line-2);color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.who b{color:var(--ink)}
.btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);background:var(--panel-2);overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
.filters{padding:12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters button{font-size:11.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.list{padding:6px}
.row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.row:hover{background:var(--line-2)}
.row.active{background:var(--accent-soft);color:var(--accent-ink)}
.row .dot{width:8px;height:8px;border-radius:99px;background:var(--line);flex:none;position:relative}
.row.done .dot{background:var(--ok)}.row.rej .dot{background:var(--no)}.row.partial .dot{background:var(--warn)}
.row .src{font-family:var(--font-mono);font-size:11px;flex:none;width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mine{margin-left:auto;font-size:11px;flex:none}
.row .tv{color:var(--warn);font-size:11px;flex:none}
main{padding:26px clamp(16px,4vw,44px);display:flex;justify-content:center}
.card{width:100%;max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card .top{padding:16px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.idx{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{font-size:11px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--line-2);color:var(--muted)}
.chip.src{font-family:var(--font-mono);text-transform:none;letter-spacing:0;background:var(--accent-soft);color:var(--accent-ink)}
.chip.tv{background:var(--warn-soft);color:var(--warn)}
.agree{margin-left:auto;font-size:12px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:6px}
.agree.done{color:var(--ok)}.agree.partial{color:var(--warn)}
.body{padding:22px}
.q{font-family:var(--font-doc);font-size:23px;line-height:1.32;letter-spacing:-.01em;text-wrap:balance;margin:0 0 20px}
.warnbox{display:flex;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:13px;margin:0 0 18px;line-height:1.4}
.warnbox b{font-weight:700}
label.fld{display:block;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px 14px;font-family:var(--font-ui);font-size:15px;line-height:1.5;resize:vertical}
textarea.ans{min-height:92px}textarea.note{min-height:52px;font-size:13.5px}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0 4px}
.meta .m{display:flex;flex-direction:column;gap:4px}
.meta label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650}
.meta select{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:13px;font-family:var(--font-ui)}
.tvtoggle{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.spacer{height:14px}
.actions{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:flex;gap:8px}
.abtn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:650;cursor:pointer;display:flex;gap:8px;align-items:center}
.abtn kbd{font-family:var(--font-mono);font-size:11px;background:var(--line-2);border-radius:4px;padding:1px 5px;color:var(--muted)}
.abtn.approve{border-color:var(--ok);color:var(--ok)}.abtn.approve:hover{background:var(--ok-soft)}
.abtn.reject{border-color:var(--no);color:var(--no)}.abtn.reject:hover{background:var(--no-soft)}
.abtn.skip:hover{background:var(--line-2)}
.grow{flex:1}
.hint{font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.gate{position:fixed;inset:0;background:rgba(15,19,26,.55);display:flex;align-items:center;justify-content:center;z-index:50}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;width:min(90vw,380px)}
.gate h2{margin:0 0 6px;font-size:18px}
.gate p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);font-size:15px;margin-bottom:12px}
.gate .quick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.gate .quick button{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);cursor:pointer;font-weight:600;font-size:13px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
@media (max-width:820px){.wrap{grid-template-columns:1fr}aside{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="brand"><h1>Civics Review</h1><span class="sub" id="drLabel">K-12 · shared queue</span></div>
  <div class="meter"><div class="track"><i id="mBar"></i></div>
    <div class="lbl"><span id="mFinal">0/0 finalized</span><span id="mPct">0%</span></div></div>
  <div class="counts"><span class="pill ok" id="cMine">0 by you</span><span class="pill pend" id="cQueue">0 in your queue</span></div>
  <div class="who">reviewing as <b id="whoName">…</b> <button class="btn" id="switchBtn" style="padding:4px 8px">switch</button></div>
  <button class="btn primary" id="exportBtn">Export approved</button>
</header>

<div class="wrap">
  <aside>
    <div class="filters" id="filters">
      <button data-f="queue" aria-pressed="true">My queue</button>
      <button data-f="all">All</button>
      <button data-f="final">Finalized</button>
      <button data-f="tv">Time-varying</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div>
    <main><div class="card" id="card"></div></main>
    <div class="actions">
      <div class="nav"><button class="abtn skip" id="prevBtn">‹ Prev <kbd>J</kbd></button>
        <button class="abtn skip" id="nextBtn">Next › <kbd>K</kbd></button></div>
      <div class="grow"></div>
      <button class="abtn reject" id="rejectBtn">Reject <kbd>R</kbd></button>
      <button class="abtn skip" id="skipBtn">Skip <kbd>S</kbd></button>
      <button class="abtn approve" id="approveBtn">Approve <kbd>A</kbd></button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate" style="display:none"><div class="box">
  <h2>Who's reviewing?</h2><p>Your name is recorded on each decision and counts toward the 2-of-3 agreement on time-varying items.</p>
  <div class="quick" id="quickNames"></div>
  <input id="nameInput" placeholder="or type your name" autocomplete="off">
  <button class="btn primary" id="gateGo" style="width:100%">Start reviewing</button>
</div></div>

<script>
const $=s=>document.querySelector(s);
let REVIEWER=localStorage.getItem("civics-reviewer")||"";
let ITEMS=[], cur=0, filter="queue", DR="time_varying";
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1400);}

function resolved(it){return it.approvals>=it.needed || it.rejections>=it.needed;}
function inQueue(it){return !resolved(it) && it.my_status==="pending";}
function rowClass(it){return resolved(it)?(it.approvals>=it.needed?"done":"rej"):(it.approvals>0?"partial":"");}

async function loadItems(){
  const r=await fetch("/api/items?reviewer="+encodeURIComponent(REVIEWER));
  const j=await r.json(); ITEMS=j.items; DR=j.double_review;
  $("#drLabel").textContent = DR==="all"?"K-12 · 2-of-3 all":DR==="none"?"K-12 · single review":"K-12 · 2-of-3 on time-varying";
  if(filter==="queue"){const q=visible();cur=q.length?q[0]:0;}
  renderAll();
}
function visible(){
  return ITEMS.map((_,i)=>i).filter(i=>{const it=ITEMS[i];
    if(filter==="all")return true;
    if(filter==="tv")return it.time_varying;
    if(filter==="final")return it.approvals>=it.needed;
    return inQueue(it);});
}
function renderList(){
  const vis=visible(),el=$("#list");el.innerHTML="";
  vis.forEach(i=>{const it=ITEMS[i];
    const row=document.createElement("div");
    row.className="row "+rowClass(it)+(i===cur?" active":"");
    const mine=it.my_status==="approved"?"✓":it.my_status==="rejected"?"✕":"";
    row.innerHTML=`<span class="dot"></span><span class="src">${it.source}</span>`+
      (it.time_varying?`<span class="tv">◷</span>`:"")+`<span class="mine">${mine}</span>`;
    row.onclick=()=>{cur=i;renderAll();};el.appendChild(row);});
}
function renderCard(){
  if(!ITEMS.length){$("#card").innerHTML="";return;}
  const it=ITEMS[cur];
  const agreeCls=it.approvals>=it.needed?"done":it.approvals>0?"partial":"";
  const agreeTxt=`${it.approvals}/${it.needed} approvals`+(it.approvers.length?` · ${it.approvers.join(", ")}`:"");
  const mineTag=it.my_status==="approved"?`<span class="chip" style="background:var(--ok-soft);color:var(--ok)">you approved</span>`:
    it.my_status==="rejected"?`<span class="chip" style="background:var(--no-soft);color:var(--no)">you rejected</span>`:"";
  $("#card").innerHTML=`
    <div class="top"><span class="idx">${cur+1} / ${ITEMS.length}</span>
      <span class="chip src">${it.source}</span>
      <span class="chip">${(it.my_strand||it.strand).replace("_"," ")}</span>
      <span class="chip">${it.my_band||it.grade_band}</span>
      ${it.time_varying?`<span class="chip tv">◷ time-varying</span>`:""}
      ${mineTag}
      <span class="agree ${agreeCls}">${agreeTxt}</span></div>
    <div class="body">
      <p class="q">${esc(it.q)}</p>
      ${it.time_varying?`<div class="warnbox"><span>◷</span><span><b>Time-varying — needs 2 of 3.</b>
        Teach the concept and point to an official lookup; never bake in the current fact.</span></div>`:""}
      <label class="fld" for="ans">Answer — edit as needed</label>
      <textarea id="ans" class="ans">${esc(it.my_answer)}</textarea>
      <div class="meta">
        <div class="m"><label for="selStrand">Strand</label><select id="selStrand">
          ${["civic_life","foundations","constitution","world_affairs","citizen_roles"].map(s=>`<option ${((it.my_strand||it.strand)===s)?"selected":""}>${s}</option>`).join("")}</select></div>
        <div class="m"><label for="selBand">Grade band</label><select id="selBand">
          ${["elementary","middle","high"].map(b=>`<option ${((it.my_band||it.grade_band)===b)?"selected":""}>${b}</option>`).join("")}</select></div>
        <div class="m"><label>Flag</label><label class="tvtoggle"><input type="checkbox" id="tvChk" ${it.time_varying?"checked":""}> time-varying</label></div>
      </div>
      <div class="spacer"></div>
      <label class="fld" for="note">Reviewer note (optional)</label>
      <textarea id="note" class="note">${esc(it.my_note)}</textarea>
    </div>`;
}
function renderStats(){
  const n=ITEMS.length; let fin=0,mine=0,queue=0;
  ITEMS.forEach(it=>{if(it.approvals>=it.needed)fin++; if(it.my_status!=="pending")mine++; if(inQueue(it))queue++;});
  $("#mBar").style.width=(n?fin/n*100:0)+"%";
  $("#mFinal").textContent=`${fin}/${n} finalized`; $("#mPct").textContent=(n?Math.round(fin/n*100):0)+"%";
  $("#cMine").textContent=mine+" by you"; $("#cQueue").textContent=queue+" in your queue";
}
function renderAll(){renderList();renderCard();renderStats();bindCard();
  const a=document.querySelector(".row.active");if(a)a.scrollIntoView({block:"nearest"});}
function curPayload(status){const it=ITEMS[cur];return{source:it.source,grade_band:it.grade_band,reviewer:REVIEWER,
  status,answer:$("#ans")?$("#ans").value:it.my_answer,strand:$("#selStrand")?$("#selStrand").value:it.strand,
  band:$("#selBand")?$("#selBand").value:it.grade_band,tv:$("#tvChk")?$("#tvChk").checked:it.time_varying,
  note:$("#note")?$("#note").value:""};}
async function saveField(){ // persist edits without changing status
  const it=ITEMS[cur];const p=curPayload(it.my_status);
  const r=await fetch("/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
  Object.assign(it,await r.json());it.my_answer=p.answer;it.my_note=p.note;it.my_strand=p.strand;it.my_band=p.band;
}
function bindCard(){
  const ans=$("#ans");if(!ans)return;
  let t;const deb=()=>{clearTimeout(t);t=setTimeout(saveField,600);};
  ans.addEventListener("input",deb);$("#note").addEventListener("input",deb);
  $("#selStrand").addEventListener("change",saveField);$("#selBand").addEventListener("change",saveField);
  $("#tvChk").addEventListener("change",saveField);
}
async function decide(status){
  const it=ITEMS[cur];const p=curPayload(status);
  const r=await fetch("/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
  Object.assign(it,await r.json());it.my_status=status;it.my_answer=p.answer;it.my_note=p.note;it.my_strand=p.strand;it.my_band=p.band;
  toast(status==="approved"?"Approved":status==="rejected"?"Rejected":"Skipped");
  const vis=visible();const pos=vis.indexOf(cur);
  if(pos>-1&&pos<vis.length-1)cur=vis[pos+1]; else {const q=ITEMS.findIndex(inQueue);if(q>-1)cur=q;}
  renderAll();
}
function step(d){const vis=visible();let p=vis.indexOf(cur);
  if(p<0)cur=vis[0]??cur; else{p=Math.max(0,Math.min(vis.length-1,p+d));cur=vis[p];}renderAll();}

$("#approveBtn").onclick=()=>decide("approved");
$("#rejectBtn").onclick=()=>decide("rejected");
$("#skipBtn").onclick=()=>decide("pending");
$("#prevBtn").onclick=()=>step(-1);$("#nextBtn").onclick=()=>step(1);
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll("#filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  const vis=visible();if(vis.length&&!vis.includes(cur))cur=vis[0];renderAll();});
$("#exportBtn").onclick=()=>window.open("/api/export","_blank");
$("#switchBtn").onclick=()=>openGate();
document.addEventListener("keydown",e=>{const t=e.target.tagName;
  if(t==="TEXTAREA"||t==="INPUT"||t==="SELECT")return;const k=e.key.toLowerCase();
  if(k==="a"){decide("approved");e.preventDefault();}else if(k==="r"){decide("rejected");e.preventDefault();}
  else if(k==="s"){decide("pending");e.preventDefault();}else if(k==="j"||k==="arrowleft"){step(-1);e.preventDefault();}
  else if(k==="k"||k==="arrowright"){step(1);e.preventDefault();}else if(k==="e"){const a=$("#ans");if(a){a.focus();e.preventDefault();}}});

function openGate(){
  $("#gate").style.display="flex";
  const q=$("#quickNames");q.innerHTML="";
  ["Reviewer 1","Reviewer 2","Reviewer 3"].forEach(n=>{const b=document.createElement("button");b.textContent=n;
    b.onclick=()=>{$("#nameInput").value=n;};q.appendChild(b);});
  $("#nameInput").value=REVIEWER;$("#nameInput").focus();
}
$("#gateGo").onclick=()=>{const v=$("#nameInput").value.trim();if(!v){$("#nameInput").focus();return;}
  REVIEWER=v;localStorage.setItem("civics-reviewer",v);$("#whoName").textContent=v;$("#gate").style.display="none";loadItems();};
$("#nameInput")&&$("#nameInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("#gateGo").click();});

setInterval(()=>{ // live sync of teammates' progress (skip while typing)
  if(["TEXTAREA","INPUT"].includes(document.activeElement.tagName))return;
  fetch("/api/items?reviewer="+encodeURIComponent(REVIEWER)).then(r=>r.json()).then(j=>{ITEMS=j.items;renderList();renderStats();
    const it=ITEMS[cur];if(it){const c=$(".agree");}});
},15000);

if(REVIEWER){$("#whoName").textContent=REVIEWER;loadItems();}else{openGate();}
</script>
